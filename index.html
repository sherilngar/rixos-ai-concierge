<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Rixos Bab Al Bahr AI Concierge: a live proposal demo of a guest concierge that understands free text in any language, routes requests to the right department and keeps guests updated."
    />
    <meta name="theme-color" content="#F6F2EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C1A17'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23C9A774'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Rixos AI Concierge · Proposal demo</title>
    <script>
      try {
        var t = localStorage.getItem('rixos-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <script>
      // After a new deploy, a cached page can point at script files that no longer exist,
      // which would leave a blank screen. Reload once with a fresh copy, then show a message.
      (function () {
        var KEY = 'rixos-reload-at';
        function fallback() {
          var root = document.getElementById('root');
          if (!root || root.children.length) return;
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:22rem;margin:20vh auto;padding:0 1.5rem;text-align:center;color:#1C1A17">' +
            '<p style="font-size:1.25rem;margin-bottom:.5rem">The app needs a refresh</p>' +
            '<p style="color:#665E54;font-size:.9rem;margin-bottom:1.25rem">A new version was just published. Tap below to load it.</p>' +
            '<button onclick="location.reload()" style="min-height:44px;padding:0 1.5rem;border-radius:999px;border:0;background:#1C1A17;color:#fff;font-size:1rem">Reload</button></div>';
        }
        function recover() {
          try {
            var last = Number(sessionStorage.getItem(KEY)) || 0;
            if (Date.now() - last > 30000) {
              sessionStorage.setItem(KEY, String(Date.now()));
              var url = new URL(location.href);
              url.searchParams.set('v', String(Date.now()));
              location.replace(url.toString());
              return;
            }
          } catch (e) {}
          fallback();
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            var src = t && (t.src || t.href);
            if (src && /\/assets\//.test(src) && (t.tagName === 'SCRIPT' || t.tagName === 'LINK'))
              recover();
          },
          true,
        );
        window.addEventListener('vite:preloadError', function (e) {
          e.preventDefault();
          recover();
        });
        setTimeout(fallback, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This demo needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
